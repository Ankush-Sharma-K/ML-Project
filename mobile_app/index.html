<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>IDR Navigator</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">◎</span>
      <div>
        <h1>IDR Navigator</h1>
        <p class="sub">AI dead reckoning for GPS-denied tunnels</p>
      </div>
    </div>
    <span id="statusChip" class="chip chip-idle" title="Navigation source">IDLE</span>
  </header>

  <main>
    <section class="mapwrap">
      <div id="map" aria-label="Map"></div>
      <div id="banner" class="banner" hidden></div>
      <div id="busy" class="busy" hidden><div class="spinner"></div><span>Running the edge engine…</span></div>
    </section>

    <section class="readouts" aria-label="Live readouts">
      <div class="card"><span class="label">Speed</span><span id="rSpeed" class="value">–</span><span class="unit">km/h</span></div>
      <div class="card"><span class="label">Heading</span><span id="rHeading" class="value">–</span><span class="unit">°</span></div>
      <div class="card"><span class="label">Uncertainty</span><span id="rSigma" class="value">–</span><span class="unit">± m</span></div>
      <div class="card"><span class="label">In tunnel</span><span id="rTime" class="value">–</span><span class="unit">s</span></div>
    </section>

    <section class="routebar">
      <span id="routeChip" class="chip chip-idle">ROUTE –</span>
      <span id="routeDist" class="muted"></span>
      <span id="endError" class="muted right"></span>
    </section>

    <section class="playback">
      <button id="playBtn" class="btn icon" aria-label="Play" disabled>▶</button>
      <input id="scrub" type="range" min="0" max="0" value="0" disabled aria-label="Playback position">
      <span id="clock" class="muted mono">0:00</span>
    </section>

    <section class="controls">
      <label>Drive
        <select id="driveSel"></select>
      </label>
      <label>Tunnel starts at
        <select id="startSel"></select>
      </label>
      <div class="field">
        <span class="flabel">Tunnel length</span>
        <div class="seg" id="lenSeg" role="radiogroup">
          <button data-v="30">30 s</button><button data-v="60">60 s</button><button data-v="120" class="on">120 s</button>
        </div>
      </div>
      <div class="field">
        <span class="flabel">Planned route</span>
        <div class="seg" id="routeSeg" role="radiogroup">
          <button data-v="correct" class="on">Correct</button><button data-v="wrong">Wrong turn</button>
        </div>
      </div>
      <button id="runBtn" class="btn primary">Simulate tunnel</button>
      <p id="mode" class="muted small"></p>
    </section>

    <section class="legend" aria-label="Legend">
      <span><i class="sw sw-gps"></i>GPS before tunnel</span>
      <span><i class="sw sw-hidden"></i>True path (hidden from engine)</span>
      <span><i class="sw sw-dr"></i>IDR estimate (DR)</span>
      <span><i class="sw sw-map"></i>IDR + map</span>
      <span><i class="sw sw-fix"></i>Corrected after exit</span>
      <span><i class="sw sw-route"></i>Planned route</span>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
